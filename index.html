<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroid Flyby Trajectory Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/postprocessing/EffectComposer.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/EffectComposer.js",
        "three/examples/jsm/postprocessing/RenderPass.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/RenderPass.js",
        "three/examples/jsm/postprocessing/UnrealBloomPass.js": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/postprocessing/UnrealBloomPass.js"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #04070d;
      --panel: rgba(9, 15, 28, 0.74);
      --panel-border: rgba(120, 170, 255, 0.18);
      --text: #eaf1ff;
      --muted: #9db0d1;
      --accent: #6ad7ff;
      --accent-strong: #9cf4ff;
      --danger: #ff6a5f;
      --warning: #ffb347;
      --safe: #4ee09a;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(58, 102, 185, 0.28), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(70, 194, 255, 0.18), transparent 22%),
        linear-gradient(135deg, #02040a 0%, #050913 45%, #02050c 100%);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);
      opacity: 0.72;
      mix-blend-mode: screen;
      animation: drift 16s ease-in-out infinite alternate;
    }

    body::before {
      width: 34vw;
      height: 34vw;
      left: -8vw;
      top: -5vw;
      background: radial-gradient(circle, rgba(79, 172, 255, 0.26), rgba(79, 172, 255, 0.02) 68%, transparent 72%);
    }

    body::after {
      width: 44vw;
      height: 44vw;
      right: -10vw;
      bottom: -12vw;
      background: radial-gradient(circle, rgba(255, 149, 85, 0.18), rgba(255, 149, 85, 0.02) 66%, transparent 72%);
      animation-delay: -8s;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr) minmax(280px, 340px);
      gap: 20px;
      padding: 20px;
      z-index: 1;
    }

    .sidebar,
    .info-panel {
      position: relative;
      z-index: 5;
      min-height: 0;
      display: flex;
      align-items: flex-start;
    }

    .canvas-shell {
      position: relative;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(120, 170, 255, 0.14);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      background:
        radial-gradient(circle at center, rgba(23, 38, 74, 0.24), rgba(2, 5, 10, 0.72)),
        linear-gradient(135deg, rgba(10, 18, 38, 0.82), rgba(3, 5, 10, 0.9));
    }

    .canvas-shell::before,
    .canvas-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .canvas-shell::before {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 16%),
        radial-gradient(circle at 50% 50%, transparent 48%, rgba(3, 5, 10, 0.45) 100%);
      mix-blend-mode: screen;
    }

    .canvas-shell::after {
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.42);
    }

    #viewport {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .panel {
      width: 100%;
      background:
        linear-gradient(180deg, rgba(18, 25, 42, 0.82), rgba(7, 12, 22, 0.78)),
        var(--panel);
      border: 1px solid rgba(120, 170, 255, 0.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 20px;
      box-shadow: 0 18px 70px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .info-panel .panel {
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }

    .panel-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), transparent),
        radial-gradient(circle at 20% 0%, rgba(106, 215, 255, 0.1), transparent 40%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--accent-strong);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(106, 215, 255, 0.8);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.8vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .panel-body {
      padding: 16px 18px 18px;
      display: grid;
      gap: 14px;
    }

    select,
    button {
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease, color 180ms ease;
    }

    select:hover,
    button:hover {
      transform: translateY(-1px);
    }

    .control-group {
      display: grid;
      gap: 10px;
    }

    .control-row {
      display: grid;
      gap: 8px;
    }

    .control-row label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      color: var(--text);
    }

    .control-row label span:last-child {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    select {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      outline: none;
    }

    select:focus,
    button:focus {
      border-color: rgba(106, 215, 255, 0.54) !important;
      box-shadow: 0 0 0 3px rgba(106, 215, 255, 0.14);
    }

    input[type="range"] {
      width: 100%;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(106, 215, 255, 0.45), rgba(106, 215, 255, 0.15));
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(180deg, #eaffff, #70dfff);
      border: 0;
      box-shadow: 0 0 0 6px rgba(106, 215, 255, 0.14);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(180deg, #eaffff, #70dfff);
      border: 0;
      box-shadow: 0 0 0 6px rgba(106, 215, 255, 0.14);
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      gap: 12px;
      padding: 18px;
      overflow-y: auto;
      min-height: 0;
    }

    .stat {
      display: grid;
      gap: 6px;
      padding: 14px 14px 13px;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.025)),
        rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .stat .value {
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .risk-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      width: fit-content;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .risk-high {
      color: var(--danger);
      box-shadow: inset 0 0 0 1px rgba(255, 106, 95, 0.2);
    }

    .risk-medium {
      color: var(--warning);
      box-shadow: inset 0 0 0 1px rgba(255, 179, 71, 0.18);
    }

    .risk-safe {
      color: var(--safe);
      box-shadow: inset 0 0 0 1px rgba(78, 224, 154, 0.18);
    }

    .footer-note {
      padding: 0 18px 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .crosshair {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(106, 215, 255, 0.14);
      pointer-events: none;
      z-index: 4;
    }

    .crosshair::before,
    .crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255, 255, 255, 0.18);
    }

    .crosshair::before {
      width: 26px;
      height: 1px;
      transform: translate(-50%, -50%);
    }

    .crosshair::after {
      width: 1px;
      height: 26px;
      transform: translate(-50%, -50%);
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(18px, -14px, 0) scale(1.04);
      }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(360px, 52vh) auto;
        height: auto;
        min-height: 100%;
        padding: 16px;
      }

      .sidebar,
      .info-panel {
        align-items: stretch;
      }

      .crosshair {
        display: none;
      }

      .canvas-shell {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-header">
            <div class="eyebrow">Trajectory lab</div>
            <h1>Asteroid Flyby Simulator</h1>
            <p class="subtitle">Tune a near-Earth asteroid approach, inspect the predicted path, and monitor the live closest-approach estimate in 3D.</p>
          </div>
          <div class="panel-body" id="controlsPanel"></div>
        </section>
      </aside>

      <main class="canvas-shell">
        <div id="viewport"></div>
        <div class="crosshair"></div>
      </main>

      <aside class="info-panel">
        <section class="panel">
          <div class="panel-header">
            <div class="eyebrow">Live telemetry</div>
            <h1>Simulation Data</h1>
          </div>
          <div class="stats-grid" id="statsPanel"></div>
          <div class="footer-note">Risk thresholds: HIGH below 7,000, MEDIUM below 20,000, SAFE otherwise.</div>
        </section>
      </aside>
    </div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
